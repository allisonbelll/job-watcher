name: Daily job watch

on:
  schedule:
    - cron: "23 12 * * *"   # every day at 12:23 UTC (6:23 a.m. Central)
    - cron: "47 21 * * *"   # backup at 21:47 UTC (3:47 p.m. Central); a second run the same day just replaces that day
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests (a failure is reported but never blocks the day's data)
        continue-on-error: true
        run: python -m pytest -q
      - name: Fetch sources, build history and status, publish issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m watcher.run
      - name: Commit raw files, history and status
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily run $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
