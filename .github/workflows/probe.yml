name: Probe job boards

# Run by hand from the Actions tab to test which candidate boards return JSON.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = all candidates, diag = quick Workday check"
        default: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u -m watcher.${{ inputs.mode || 'probe' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: probe_results.json
          if-no-files-found: ignore
