name: Probe job boards

# Run by hand from the Actions tab to test which candidate boards return JSON.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m watcher.probe
      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe_results.json
